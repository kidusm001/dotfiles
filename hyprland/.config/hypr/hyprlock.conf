# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/wallpapers/arsenal.png # Keep your existing background
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(235, 210, 140, 1.0) # Light gold
    font_size = 72
    font_family = StretchPro
    position = 40, -40
    halign = left
    valign = top
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B, %a.")"
    color = rgba(235, 210, 140, 0.95) # Light gold
    font_size = 12
    font_family = Suisse Int'l Mono
    position = 40, -120
    halign = left
    valign = top
}

# USER
label {
    monitor =
    text =     $USER
    color = rgba(235, 210, 140, 0.9) # Light gold
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 14
    font_family = SF Pro Display Bold
    position = 0, -500
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(49, 50, 68, 0.5) # Catppuccin Mocha: Surface0 (with alpha)
    inner_color = rgba(69, 71, 90, 0.3) # Catppuccin Mocha: Surface1 (with alpha)
    font_color = rgb(235, 210, 140) # Light gold
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ebd28c99"> Enter Pass</span></i> # Light gold with alpha
    hide_input = false
    size = 260, 50
    position = 0, -420
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/songdetail.sh)" 
    color = rgba(235, 210, 140, 1.0) # Light gold
    font_size = 14
    font_family = JetBrains Mono Nerd, SF Pro Display Bold
    position = -40, 20
    halign = right
    valign = bottom
}
